# Code generated from internal/ci with go generate; DO NOT EDIT.

name: Test
"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
defaults:
  run:
    shell: bash
jobs:
  generate-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the generated workflows
        run: |-
          go generate ./internal/ci
          git diff --exit-code -- .github/workflows
  test-ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        env:
          CHEMONKEY: "1"
        run: go test ./...
  test-windows-latest:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        env:
          CHEMONKEY: "1"
        run: go test ./...
