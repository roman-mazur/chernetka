name: Release Binaries
"on":
  workflow_dispatch: {}
  release:
    types:
      - created
defaults:
  run:
    shell: bash
jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Print go env
        run: |-
          go version
          go env
      - name: Download modules
        run: go mod download
      - name: Build
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |-
          mkdir -p ./out
          go build -ldflags='-s -w' -trimpath -tags=netgo -o ./out/che-linux-amd64 ./cmd/che
      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ./out/che-linux-amd64 --clobber
